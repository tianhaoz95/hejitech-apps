name: KidsCam
options:
  bundleIdPrefix: com.hejitech
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  # In-app feedback (FeedbackKit project "ToddlerCam"), from its published repo: never a path into
  # another project of the monorepo.
  FeedbackKit:
    url: https://github.com/tianhaoz95/feedback-kit
    from: 1.0.62

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The app, watch app and complications share one version. scripts/cut_release.sh toddlercam
    # bumps MARKETING_VERSION; CI sets CURRENT_PROJECT_VERSION (UTC timestamp build numbers).
    MARKETING_VERSION: "1.2.8"
    CURRENT_PROJECT_VERSION: "1"
    # The HEJI team. Automatic signing; simulator builds don't sign.
    DEVELOPMENT_TEAM: 68CTFST8W2
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    "CODE_SIGNING_ALLOWED[sdk=watchsimulator*]": NO

targets:
  KidsCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KidsCam
        # Copies of the asset catalog's demo images (DualPhotoRenderer's simulator fallback).
        excludes:
          - "Resources/*.jpg"
    dependencies:
      - package: FeedbackKit
      - target: KidsCamWatch
        embed: true
    info:
      path: KidsCam/App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: ToddlerCam
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "ToddlerCam needs access to front and rear cameras so your toddler can explore photography with dual-camera view."
        NSPhotoLibraryAddUsageDescription: "ToddlerCam saves your toddler's dual photos to your photo library."
        NSPhotoLibraryUsageDescription: "ToddlerCam allows parents to view photos and create custom Apple Watch faces."
        NSMicrophoneUsageDescription: "ToddlerCam uses the microphone for fun camera reactions and sound effects."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - prefs
          - app-prefs
          - App-prefs
          - App-Prefs
          - itms-watch
          - watch
        CFBundleURLTypes:
          - CFBundleURLName: com.hejitech.kidscam
            CFBundleURLSchemes:
              - toddlercam
              - kidscam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.kidscam
        PRODUCT_NAME: ToddlerCam
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "ToddlerCam needs access to front and rear cameras so your toddler can explore photography with dual-camera view."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "ToddlerCam saves your toddler's dual photos to your photo library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ToddlerCam allows parents to view photos and create custom Apple Watch faces."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ToddlerCam uses the microphone for fun camera reactions and sound effects."
        INFOPLIST_KEY_CFBundleDisplayName: "ToddlerCam"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  KidsCamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - KidsCamWatch
      - path: KidsCam/Vision/FaceEmojiType.swift
    dependencies:
      - target: KidsCamWatchWidgets
        embed: true
    info:
      path: KidsCamWatch/App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: ToddlerCam
        WKCompanionAppBundleIdentifier: com.hejitech.kidscam
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: com.hejitech.kidscam.watchkitapp
            CFBundleURLSchemes:
              - toddlercam
              - kidscam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.kidscam.watchkitapp
        PRODUCT_NAME: ToddlerCamWatch
        TARGETED_DEVICE_FAMILY: "4"
        WKCompanionAppBundleIdentifier: com.hejitech.kidscam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KidsCamWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - KidsCamWatchWidgets
    info:
      path: KidsCamWatchWidgets/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: ToddlerCam Complications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.kidscam.watchkitapp.complications
        PRODUCT_NAME: ToddlerCamComplications
        TARGETED_DEVICE_FAMILY: "4"

  KidsCamTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - KidsCamTests
    dependencies:
      - target: KidsCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.kidscam.tests
        PRODUCT_NAME: KidsCamTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ToddlerCam.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ToddlerCam
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  KidsCam:
    build:
      targets:
        KidsCam: all
    test:
      targets:
        - KidsCamTests
  KidsCamWatch:
    build:
      targets:
        KidsCamWatch: all
  KidsCamWatchWidgets:
    build:
      targets:
        KidsCamWatchWidgets: all
