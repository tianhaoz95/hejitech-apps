# XcodeGen spec. `xcodegen generate` creates Headway.xcodeproj (git-ignored).
name: Headway
options:
  bundleIdPrefix: com.hejitech
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    APP_DISPLAY_NAME: Headway
    PRODUCT_SLUG: headway
    DEVELOPMENT_TEAM: 68CTFST8W2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.6"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HeadwayKit:
    path: HeadwayKit

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: WatchShared
    dependencies:
      - package: HeadwayKit
      - target: WatchApp
      - target: Widgets
    settings:
      base:
        PRODUCT_NAME: Headway
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.hejitech.headway
            CFBundleURLSchemes: [headway]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true

  Widgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
    dependencies:
      - package: HeadwayKit
    settings:
      base:
        PRODUCT_NAME: HeadwayWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Headway Widgets"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Headway Widgets"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true

  WatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: WatchShared
    dependencies:
      - package: HeadwayKit
      - target: WatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: HeadwayWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG)
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKCompanionAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG)
        WKApplication: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Watch/Watch.entitlements

  WatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchWidgets
      - path: WatchShared
    dependencies:
      - package: HeadwayKit
    settings:
      base:
        PRODUCT_NAME: HeadwayWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Headway Complications"
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Headway Complications"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG).watchkitapp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: WatchWidgets/WatchWidgets.entitlements

schemes:
  App:
    build:
      targets:
        App: all
        Widgets: all
        WatchApp: all
        WatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
  WatchApp:
    build:
      targets:
        WatchApp: all
        WatchWidgets: all
    run:
      config: Debug
