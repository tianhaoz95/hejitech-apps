<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2416"/>
      <stop offset="1" stop-color="#03100a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Railway track running to the horizon: sleepers wider than the rails -->
  <g stroke="#3dff7a" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M190 880 H834" stroke-width="34" opacity=".55"/>
    <path d="M276 720 H748" stroke-width="28" opacity=".45"/>
    <path d="M350 590 H674" stroke-width="22" opacity=".38"/>
    <path d="M408 492 H616" stroke-width="18" opacity=".3"/>
    <path d="M232 960 L478 420" stroke-width="40"/>
    <path d="M792 960 L546 420" stroke-width="40"/>
  </g>
  <!-- The next-train readout: a heads-up display line -->
  <g fill="#3dff7a" filter="url(#glow)">
    <rect x="232" y="196" width="560" height="92" rx="46" opacity=".16"/>
    <circle cx="300" cy="242" r="22"/>
    <rect x="352" y="224" width="250" height="36" rx="18"/>
    <rect x="626" y="224" width="110" height="36" rx="18" opacity=".7"/>
  </g>
</svg>
