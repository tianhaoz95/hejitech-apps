<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline · Trading Plan Board</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #f4f6f9; --card: #fff; --fg: #0e1726; --muted: #64748b; --line: rgb(15 23 42 / .09); --accent: #2456d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0e14; --card: #10161f; --fg: #e8eef6; --muted: #8b9aad; --line: rgb(255 255 255 / .08); --accent: #7ea6ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--fg); font: 15.5px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-align: center; }
      .card { max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; }
      svg { display: block; margin: 0 auto; }
      h1 { font-size: 20px; margin: 14px 0 6px; letter-spacing: -.01em; }
      p { color: var(--muted); margin: 0 0 18px; }
      button { font: inherit; font-weight: 620; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="56" height="56" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22466d"/><stop offset="1" stop-color="#1a3653"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><g transform="translate(32 32) scale(1) translate(-32 -34.25)"><path d="M14 44 26 30l8 7 16-18" fill="none" stroke="#7fd1c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="48" width="36" height="4" rx="2" fill="#e8eef5"/></g></svg>
      <h1>You're offline</h1>
      <p>The board only ever shows live plans, so it needs a connection. Your executor keeps running on its own machine.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
