# XcodeGen spec. `xcodegen generate` creates Tradeboard.xcodeproj (git-ignored).
name: Tradeboard
options:
  bundleIdPrefix: com.hejitech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    APP_DISPLAY_NAME: Tradeboard
    PRODUCT_SLUG: tradeboard
    DEVELOPMENT_TEAM: 68CTFST8W2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TradeboardKit:
    path: TradeboardKit

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TradeboardKit
    settings:
      base:
        PRODUCT_NAME: Tradeboard
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
