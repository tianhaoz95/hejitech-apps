[package]
name = "tradeboard-executor-app"
version = "0.0.0"
description = "Trading Plan Board executor for the Mac"
authors = ["HEJI TECH LLC"]
license = "UNLICENSED"
edition = "2021"

[lib]
name = "tradeboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
