name: TestFlight Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom build number (optional, defaults to run_number + 10)'
        required: false
        type: string
      dry_run:
        description: 'Build & export archive only (skip TestFlight upload)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'metadata/**'
      - '.gitignore'
      - 'tools/upload_ci_secrets.py'
    tags:
      - 'v*'

concurrency:
  group: testflight-release
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Test Suite
        run: swift tools/run_tests.swift

  release:
    name: Build & Deploy to TestFlight
    needs: test
    runs-on: macos-15
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/ci-signing.keychain-db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine Build Number
        id: build_info
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            # Monotonically increasing build number exceeding initial build 6
            BUILD_NUMBER=$(( ${{ github.run_number }} + 10 ))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "### 🚀 Release Info" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Build Number**: \`$BUILD_NUMBER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry Run**: \`${{ github.event.inputs.dry_run || false }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Target Build Number: $BUILD_NUMBER"

      - name: Import Apple Distribution Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_SIGNING_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user | sed 's/^ *"//; s/" *$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "✓ Apple Distribution Certificate installed into runner keychain"

      - name: Configure App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "✓ App Store Connect API Key configured"

      - name: Archive Universal App (iOS + watchOS + Widget)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ToddlerPlay.xcodeproj \
            -scheme TinyTouch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TinyTouch.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_CFBundleVersion="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID"
          echo "✓ Universal Archive created successfully"

      - name: Generate Export Options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DESTINATION="upload"
          if [ "$DRY_RUN" = "true" ]; then
            DESTINATION="export"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>${DESTINATION}</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          PLIST
          echo "✓ ExportOptions.plist generated with destination: $DESTINATION"

      - name: Export & Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TinyTouch.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID"

          if [ "$DRY_RUN" = "true" ]; then
            echo "✓ Dry-run completed: Archive exported without uploading"
          else
            echo "✓ Successfully exported and uploaded build $BUILD_NUMBER to TestFlight!"
          fi

      - name: Upload IPA Artifact (Dry Run Only)
        if: ${{ github.event.inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyTouch-build-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa

      - name: Clean Up Credentials & Temporary Keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$API_KEY_PATH" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
          echo "✓ Ephemeral CI keychain and credentials cleaned up"
