name: Contempo
options:
  bundleIdPrefix: com.hejitech
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  ContempoCore:
    path: ContempoCore
  # Backend: the shared HEJI Supabase project (projects/contempo/backend.env), via ContempoCore's
  # supabase-swift dependency; no other backend SDKs.

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "86"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 68CTFST8W2
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  Contempo:
    type: application
    platform: iOS
    sources:
      - path: Contempo/Sources
      - path: Contempo/Assets.xcassets
      # Folder references (not flattened file lists) — WhisperTranscriber
      # looks these up via NSBundleResourceRequest's resolved bundle (see its
      # kdoc), which needs the on-disk subdirectory structure preserved.
      # On-Demand Resources, tagged for Initial Install (see Info.plist's
      # NSBundleResourceRequestTags below) — pulled out of the main bundle
      # into their own versioned content so routine app updates that don't
      # touch these ~99MB-each, essentially-static models don't re-transfer
      # them, while still shipping with the very first install exactly as
      # before (no on-demand fetch, no first-run network dependency).
      - path: Contempo/Resources/sherpa-onnx-whisper-tiny.en
        type: folder
        resourceTags: [whisper-tiny-en]
      # The bundled on-device model (Qwen3-0.6B, ~345MB, scripts/fetch-models.sh; not in git).
      - path: Contempo/Resources/Models
        optional: true
        buildPhase: resources
      - path: Contempo/Resources/sherpa-onnx-whisper-tiny
        type: folder
        resourceTags: [whisper-tiny-multilingual]
    info:
      path: Contempo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Contempo uses your microphone to capture spoken work-log entries."
        NSCameraUsageDescription: "Contempo uses your camera to attach a photo, or read an odometer, to a work-log entry."
        NSLocationWhenInUseUsageDescription: "Contempo uses your location to record where a work entry or mileage trip started and ended."
        NSPhotoLibraryAddUsageDescription: "Contempo saves photos you attach to work-log entries."
        UIBackgroundModes: [audio, location, fetch]
        NSSupportsLiveActivities: true
        # Google sign-in through Supabase returns here (com.hejitech.contempoapp://login-callback).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.hejitech.contempoapp
        # Debug builds (USE_FIREBASE_EMULATOR) talk to plain http://localhost
        # for Auth/Firestore/Storage/Functions — App Transport Security
        # blocks that by default, even for loopback, unless explicitly
        # allowed. This is Firebase's own documented iOS Local Emulator
        # Suite requirement, not a Contempo-specific relaxation of ATS —
        # release builds never hit this path (USE_FIREBASE_EMULATOR is
        # Debug-only, see Config/Debug.xcconfig), so it doesn't loosen
        # anything in production.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Both Whisper ODR tags (see sources above) download automatically
        # right after install, same as today's fully-bundled behavior — no
        # first-run network wait, no on-demand fetch UX to design for.
        NSBundleResourceRequestTags: [whisper-tiny-en, whisper-tiny-multilingual]
        NSBundleResourceRequestInitialInstallTags: [whisper-tiny-en, whisper-tiny-multilingual]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.contempoapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        # sherpa-onnx.xcframework wraps a plain static library with no
        # "HeadersPath" in its Info.plist (confirmed — Xcode doesn't expose
        # its headers automatically the way it would for a proper .framework
        # bundle), so the bridging header's `#import "sherpa-onnx/c-api/c-api.h"`
        # needs an explicit search path to the flat Headers/ dir the release
        # tarball ships alongside the binary.
        SWIFT_OBJC_BRIDGING_HEADER: Contempo/Sources/Vendor/SherpaOnnx/SherpaOnnx-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/sherpa-onnx/sherpa-onnx.xcframework/Headers"
        # Vendored CLiteRTLM.xcframework only ships an arm64 Simulator slice
        # (no x86_64) — nobody tests iOS 17+ on an Intel Simulator in
        # practice, so excluding it here rather than chasing a slice that
        # doesn't exist upstream either.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Contempo AppStore Contempo"
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: ContempoCore
        product: ContempoCore
      - package: ContempoCore
        product: ContempoData
      - framework: Vendor/sherpa-onnx/sherpa-onnx.xcframework
        embed: false
      - framework: Vendor/sherpa-onnx/onnxruntime.xcframework
        embed: false
      # Vendored directly (source + prebuilt xcframework under
      # ios/Vendor/litert-lm/), not via SPM: the SPM package's `revision`-
      # pinned requirement was not being honored by xcodebuild's package
      # resolver in this environment (kept re-resolving to the v0.14.0 tag
      # regardless of the pin — a reproducible Xcode/SwiftPM quirk, not
      # something fixable from project.yml), and that tag's own Package.swift
      # declares binaryTarget checksums that don't match the real release
      # assets at their fixed download URLs (confirmed by downloading and
      # hashing CLiteRTLM.xcframework.zip directly) — an upstream packaging
      # inconsistency. Vendoring sidesteps both problems the same way
      # sherpa-onnx already is above. A real .framework with its own
      # Headers/Modules (unlike sherpa-onnx's raw static lib), so no bridging
      # header or header search path needed — `import CLiteRTLM` just works
      # once linked. It's a dynamic library, so (unlike sherpa-onnx) it does
      # need embedding.
      - framework: Vendor/litert-lm/CLiteRTLM.xcframework
        embed: true
      - target: "Contempo Watch App"
        embed: true
        codeSign: true
      - target: ContempoWidgets
        embed: true
        codeSign: true
    configFiles:
      Debug: Contempo/Config/Debug.xcconfig
      Release: Contempo/Config/Release.xcconfig

  ContempoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ContempoWidgets/Sources
      # Shared ActivityAttributes types — see the Contempo target's own
      # comment on why this isn't listed there too (it's already covered by
      # `Contempo/Sources`'s recursive folder reference).
      - path: Contempo/Sources/Shared
      # Interactive Live Activity buttons (LiveActivityIntent) — kept in a
      # separate subfolder from Shared/LiveActivity above (rather than
      # relying on that already-shared path) because these import
      # Firebase/Firestore, which "Contempo Watch App" (which also pulls in
      # Shared/LiveActivity, for ContempoActivityAttributes) doesn't link and
      # doesn't build Firestore for watchOS at all — see its dependencies
      # comment.
      - path: Contempo/Sources/Shared/LiveActivityIntents
    info:
      path: ContempoWidgets/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Contempo Widgets"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.contempoapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Contempo Widgets"
        SKIP_INSTALL: "NO"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Contempo AppStore ContempoWidgets"
          CODE_SIGN_IDENTITY: "Apple Distribution"
    entitlements:
      path: ContempoWidgets/ContempoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hejitech.contempoapp
    dependencies:
      - package: ContempoCore
        product: ContempoCore
      # For PauseResumeIntents.swift (Shared/LiveActivityIntents above) —
      # LiveActivityIntent perform() runs in-app-process but still needs to
      # be *compiled* into this extension target for Button(intent:) to
      # reference the type at all.
      - package: ContempoCore
        product: ContempoData

  "Contempo Watch App":
    type: application
    platform: watchOS
    sources:
      - path: "Contempo Watch App/Sources"
      - path: "Contempo Watch App/Assets.xcassets"
      - path: Contempo/Sources/Shared/LiveActivity
    info:
      path: "Contempo Watch App/Info.plist"
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Contempo uses your microphone to capture spoken work-log entries from your wrist."
        WKCompanionAppBundleIdentifier: com.hejitech.contempoapp
        WKApplication: true
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.hejitech.contempoapp.watchkitapp.pending-upload
        CLKComplicationSupportedFamilies:
          - CLKComplicationFamilyCircularSmall
          - CLKComplicationFamilyModularSmall
          - CLKComplicationFamilyModularLarge
          - CLKComplicationFamilyUtilitarianSmall
          - CLKComplicationFamilyUtilitarianLarge
          - CLKComplicationFamilyGraphicCorner
          - CLKComplicationFamilyGraphicCircular
          - CLKComplicationFamilyGraphicRectangular
        # Same USE_FIREBASE_EMULATOR/localhost reasoning as the phone
        # target's Info.plist entry — see its comment. The watch talks to
        # the emulator both via FirebaseAuth's own networking and the
        # plain-REST WatchAudioCaptureQueueWriter/WatchEntryStatsReader.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.contempoapp.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "NO"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Contempo AppStore ContempoWatchApp"
          CODE_SIGN_IDENTITY: "Apple Distribution"
    entitlements:
      # Shared with "Contempo Watch Widgets" below so the complication can
      # read the progress this app writes via HoursProgressStore — separate
      # processes can't share plain UserDefaults.standard.
      path: "Contempo Watch App/Contempo Watch App.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.hejitech.contempoapp
    dependencies:
      # No FirebaseFirestore here — its SDK target isn't built for watchOS
      # at all (see ContempoCore/Package.swift's comment); the watch writes
      # its audioCaptures queue doc via ContempoCore's REST-based
      # WatchAudioCaptureQueueWriter instead, which only needs FirebaseAuth.
      - package: ContempoCore
        product: ContempoCore
      - target: "Contempo Watch Widgets"
        embed: true
        codeSign: true

  "Contempo Watch Widgets":
    type: app-extension
    platform: watchOS
    sources:
      - path: "Contempo Watch Widgets/Sources"
    info:
      path: "Contempo Watch Widgets/Info.plist"
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Contempo Widgets"
        WKAppBundleIdentifier: com.hejitech.contempoapp.watchkitapp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.contempoapp.watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Contempo Widgets"
        SKIP_INSTALL: "NO"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "Contempo AppStore ContempoWatchWidgets"
          CODE_SIGN_IDENTITY: "Apple Distribution"
    entitlements:
      path: "Contempo Watch Widgets/Contempo Watch Widgets.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.hejitech.contempoapp
    dependencies:
      - package: ContempoCore
        product: ContempoCore

  ContempoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ContempoTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      # `@testable import Contempo` pulls in AudioRecorder.swift/
      # WhisperTranscriber.swift, which need the same vendored sherpa-onnx C
      # headers the host app target resolves via its own bridging header —
      # not inherited automatically from the Contempo target dependency.
      SWIFT_OBJC_BRIDGING_HEADER: Contempo/Sources/Vendor/SherpaOnnx/SherpaOnnx-Bridging-Header.h
      HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/sherpa-onnx/sherpa-onnx.xcframework/Headers"
    dependencies:
      - target: Contempo

  ContempoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ContempoUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Contempo
    dependencies:
      - target: Contempo

  ContempoWatchAppTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: ContempoWatchAppTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: "Contempo Watch App"
      - package: ContempoCore
        product: ContempoCore

schemes:
  Contempo:
    build:
      targets:
        Contempo: all
        ContempoUITests: [test]
        ContempoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ContempoUITests
        - ContempoTests
    archive:
      config: Release
      revealArchiveInOrganizer: true

  Contempo Watch App:
    build:
      targets:
        "Contempo Watch App": all
        ContempoWatchAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ContempoWatchAppTests

