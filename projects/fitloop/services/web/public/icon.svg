<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112b"/>
      <stop offset="1" stop-color="#05040f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- The loop: a ring that almost closes, with an arrowhead (plan → you → feedback → plan) -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M512 196 A316 316 0 1 1 238 354" stroke="#ff7a45" stroke-width="58"/>
  </g>
  <path d="M290 262 L292 420 L154 344 Z" fill="#ff7a45" stroke="#ff7a45" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- A dumbbell in the middle -->
  <g fill="#ffd2bf" filter="url(#glow)">
    <rect x="352" y="488" width="320" height="48" rx="24"/>
    <rect x="322" y="420" width="56" height="184" rx="22"/>
    <rect x="646" y="420" width="56" height="184" rx="22"/>
    <rect x="282" y="452" width="40" height="120" rx="16"/>
    <rect x="702" y="452" width="40" height="120" rx="16"/>
  </g>
</svg>
