# XcodeGen spec. `xcodegen generate` creates FitLoop.xcodeproj (git-ignored).
name: FitLoop
options:
  bundleIdPrefix: com.hejitech
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    APP_DISPLAY_NAME: FitLoop
    PRODUCT_SLUG: fitloop
    DEVELOPMENT_TEAM: 68CTFST8W2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FitLoopKit:
    path: FitLoopKit

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: WatchShared
    dependencies:
      - package: FitLoopKit
      - target: WatchApp
    settings:
      base:
        PRODUCT_NAME: FitLoop
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSHealthShareUsageDescription: FitLoop reads your weight, resting heart rate, HRV, sleep, steps, active energy and workout heart rate once a day (only if you turn that on) to show your progress and share it with your agent.
        NSHealthUpdateUsageDescription: FitLoop saves the workouts you do with it to Apple Health.
        NSPhotoLibraryUsageDescription: Pick progress photos to keep in FitLoop (only if you turn progress photos on).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.hejitech.fitloop
            CFBundleURLSchemes: [fitloop]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  WatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: WatchShared
    settings:
      base:
        PRODUCT_NAME: FitLoopWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG)
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKCompanionAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG)
        WKApplication: true
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: FitLoop reads your heart rate during workouts you start from FitLoop.
        NSHealthUpdateUsageDescription: FitLoop saves the workouts you do with it to Apple Health.
    entitlements:
      path: Watch/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    test:
      config: Debug
