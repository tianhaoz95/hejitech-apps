# Fourth top-up: near misses for the care, health and activity types. The care round logged
# plans and questions about them as entries ("is she due for her vaccines soon" -> vaccination,
# "bath at seven tonight" -> bath), so this run writes those (none_topics) with real entries of
# the same types for contrast. Data only: configs/groups2.toml trains on it with everything else.

[run]
name = "nearmiss"
seed = 23
id_prefix = "m"             # plan ids: p full, s topup, n none, c care, m nearmiss
include = []                # data only (no build here): groups2 trains on it
plans = 700
variants = 3
val_fraction = 0.05
laya_export = "runs/laya_export_groups.json"  # the two-level questions
none_topics = [
  "planning a bath for later tonight", "asking when the next vaccines or shots are due",
  "needing to call or book the pediatrician", "asking whether a medicine or a dose is safe",
  "running low on or buying medicine, lotion or a toothbrush", "a reminder to give medicine later",
  "planning a walk or an outing later", "thinking about starting potty training or tummy time",
  "someone else asking whether the bath or the medicine was done", "what the doctor said in general",
  "reading about teething, fevers or rashes", "a checkup or vaccine appointment next week",
]
drop_none_matching = [
  "\\b(bath|lotion|cream|ointment|teeth|tooth|toothbrush|potty|teething|gums?)\\b",
  "\\b(medicine|medication|drops|vitamins?|tylenol|ibuprofen|antibiotics?)\\b",
  "\\b(rash|cough(ing)?|sneez\\w*|runny nose|vomit\\w*|threw up|fever|temperature|thermometer)\\b",
  "\\b(doctor|pediatrician|checkup|check-up|vaccines?|vaccinations?|shots?|jab)\\b",
  "\\b(tummy time|play(ed|ing|time)?|walk(ed|ing)?|stroller)\\b",
]

[types]
"none_of_these" = 0.61
"bath" = 0.03
"lotion" = 0.03
"tooth_brushing" = 0.03
"potty" = 0.03
"teething" = 0.03
"medication" = 0.03
"symptom" = 0.03
"temperature" = 0.03
"doctor_visit" = 0.03
"vaccination" = 0.03
"tummy_time" = 0.03
"play" = 0.03
"walk" = 0.03

[fields]
not_stated = 0.3            # share of field values left unsaid (the not_stated option)

[when]                      # how the time is said; the app parses times itself, but they're part of real speech
now = 0.45
relative = 0.3              # "ten minutes ago"
clock = 0.1                 # "at 3:40"
vague = 0.15                # "a bit ago", "earlier"

[children]
names = ["Mia", "Leo", "Noah", "Ava", "Aarav", "Zoe", "Mateo", "Hana", "Ollie", "Amara"]
probability = 0.2           # share of utterances that name the child

[teacher]                   # any OpenAI-compatible server, e.g. `vllm serve` on the Spark
base_url = "http://localhost:8000/v1"
api_key = "EMPTY"
model = "openai/gpt-oss-120b"
concurrency = 128         # requests in flight (vLLM batches them; 32 left the Spark mostly idle)
temperature = 0.9           # writing; the blind labelling uses 0
max_tokens = 800
reasoning_effort = "low"   # gpt-oss: short thinking (it counts against max_tokens)
retries = 3

[tts]
voices = ["af_heart", "af_bella", "af_nicole", "am_michael", "am_adam", "bf_emma", "bf_isabella", "bm_george", "bm_lewis"]
speed = [0.8, 1.1]          # tired parents, often slower
noise_snr_db = [8, 30]      # night-time rooms: fans, white-noise machines, a crying baby
reverb_probability = 0.4
max_seconds = 29
# Kokoro fails on the Spark's GPU (cuFFT error 50 under the container's CUDA forward compatibility);
# on the CPU one utterance takes ~0.8 s, so it runs in parallel processes.
device = "cpu"
workers = 10

[asr]
model = "openai/whisper-base.en"   # same weights the app runs through WhisperKit
device = "cuda"
# Must equal the closed-vocabulary prompt in apps/ios/App/Sources/Services.swift (a test checks).
prompt = "bottle, breastfeeding, nursing, diaper, wet, dirty, poop, asleep, woke up, quarter, half, three quarters, left, right, switched sides"

[train]                     # laya.train.TrainConfig (RLCD); the defaults are the authors' recipe
base_model = "convaiinnovations/laya"
epochs = 4
micro_batch = 8
grad_accum = 8
encoder_lr = 2.5e-5
head_lr = 1e-4

[convert]
llama_cpp_commit = "e467e5b"        # must equal scripts/build-llama-xcframework.sh (a test checks)
quantization = "Q8_0"               # what the app bundles

[publish]
repo = "tianhaoz95/wee-hours-baby-activity"  # Hugging Face repo the publish stage uploads to
dataset_repo = "tianhaoz95/wee-hours-baby-activity-data"  # its training data (publish_data, fetch)
private = false
