# XcodeGen spec. `xcodegen generate` (or scripts/ios.sh) creates WeeHours.xcodeproj.
# The product name and bundle ids come from two settings: APP_DISPLAY_NAME and PRODUCT_SLUG.
name: WeeHours
options:
  bundleIdPrefix: com.hejitech
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    APP_DISPLAY_NAME: Wee Hours
    PRODUCT_SLUG: weehours
    APP_GROUP: group.com.hejitech.weehours
    DEVELOPMENT_TEAM: 68CTFST8W2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LogCore:
    path: LogCore
  LayaRuntime:
    path: LayaRuntime
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0
  FeedbackKit:
    url: https://github.com/tianhaoz95/feedback-kit
    from: 1.0.62

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Resources
        excludes: ["*.storekit"]
      # On-device models (scripts/fetch-models.sh). Only a README is committed; without the
      # models the app downloads them on first use.
      - path: App/Models
        type: folder
        buildPhase: resources
    resources:
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: LogCore
      - package: LayaRuntime
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FeedbackKit
      - target: Widgets
      - target: WatchApp
    settings:
      base:
        PRODUCT_NAME: WeeHours
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # iPhone only: the UI is portrait-only, which App Store validation rejects for iPad apps.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        AppGroup: $(APP_GROUP)
        NSMicrophoneUsageDescription: Speak a log entry. Audio is transcribed on this iPhone and never uploaded.
        NSSupportsLiveActivities: true
        NSUserActivityTypes: []
        UIBackgroundModes: [fetch, processing, remote-notification, audio]
        BGTaskSchedulerPermittedIdentifiers: [com.hejitech.weehours.sync]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.hejitech.weehours
            CFBundleURLSchemes: [weehours]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.applesignin: [Default]

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: LogCore
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).widgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  WatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: LogCore
      - target: WatchWidgets
    settings:
      base:
        PRODUCT_NAME: WeeHoursWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG)
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKCompanionAppBundleIdentifier: com.hejitech.$(PRODUCT_SLUG)
        WKApplication: true
        NSMicrophoneUsageDescription: Speak a log entry; your iPhone transcribes it.
        # the complications open weehours://record
        CFBundleURLTypes:
          - CFBundleURLName: com.hejitech.$(PRODUCT_SLUG).watch
            CFBundleURLSchemes: [weehours]

  # Watch face complications: one tap opens the watch app recording (WatchWidgets.swift).
  WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
    settings:
      base:
        PRODUCT_NAME: WatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.hejitech.$(PRODUCT_SLUG).watchkitapp.widgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Subscriptions.storekit
    test:
      config: Debug
