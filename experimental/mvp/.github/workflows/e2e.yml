name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install MVP Dependencies
      run: npm install
      working-directory: experimental/mvp

    - name: Install Hub Dependencies
      run: npm install
      working-directory: experimental/hub

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      working-directory: experimental/mvp

    - name: Build Extension
      run: npm run build
      working-directory: experimental/mvp
      
    - name: Start Firebase Emulator
      run: npx firebase emulators:start --project demo-project &
      working-directory: experimental/mvp

    - name: Start Hub
      run: npm run dev &
      working-directory: experimental/hub

    - name: Run Playwright tests
      run: xvfb-run npx playwright test
      working-directory: experimental/mvp
      env:
        CI: true
        PLASMO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: experimental/mvp/playwright-report/
        retention-days: 30
