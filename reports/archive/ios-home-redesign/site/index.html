<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waypack Home Redesign</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C8603A'/%3E%3Cpath d='M7 21c4-7 7-9 9-9s5 2 9 9' stroke='%23FFE7C2' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%23F2B544'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Inter:wght@400..800&family=Nunito:wght@500..900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/designs.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">
      <span class="logo"></span>
      <span><b>Waypack iOS home</b><small>“Family warm trip” · 10 redesign candidates</small></span>
    </a>
    <nav class="tabs" aria-label="View">
      <a href="#/" data-route="gallery">Gallery</a>
      <a href="#/compare" data-route="compare">Compare</a>
    </nav>
    <div class="seg" role="group" aria-label="Phone appearance">
      <button data-mode="preferred" title="Each design in the mode it was designed for">Preferred</button>
      <button data-mode="light">Light</button>
      <button data-mode="dark">Dark</button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="picks" id="picks"></footer>
  <div class="toast" id="toast" role="status"></div>
  <div id="measure" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/kit.js"></script>
  <script src="js/designs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
