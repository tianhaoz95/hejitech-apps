name: Voxbrief CI

# macOS (VoxbriefMacTests) and iOS (VoxbriefTests) unit tests. Runs when Voxbrief changes, every
# 6 hours on main (its FeedbackKit dependency tracks a branch, so drift shows up without a commit),
# and from the Actions tab. scripts/cut_release.sh voxbrief requires it green.
on:
  push:
    branches: [main]
    paths:
      - "projects/voxbrief/**"
      - ".github/workflows/voxbrief-ci.yml"
  pull_request:
    paths:
      - "projects/voxbrief/**"
      - ".github/workflows/voxbrief-ci.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: voxbrief-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/voxbrief

jobs:
  test:
    name: Unit tests (macOS + iOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install XcodeGen
        run: brew install xcodegen

      # The bundled Qwen3-0.6B-4bit model (~337MB) is git-ignored but project.yml includes it as a
      # folder resource; cached across runs (same key as the release workflows).
      - name: Cache bundled on-device model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: projects/voxbrief/VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit
          key: voxbrief-qwen3-0.6b-4bit-mlx-community-v1

      - name: Download bundled on-device model (Qwen3-0.6B-4bit)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages --quiet -U "huggingface_hub"
          hf download mlx-community/Qwen3-0.6B-4bit \
            --local-dir VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Voxbrief.xcodeproj -scheme Voxbrief

      - name: Run macOS unit tests
        run: ./scripts/run_unit_tests.sh --mac

      - name: Run iOS unit tests
        run: ./scripts/run_unit_tests.sh --ios
