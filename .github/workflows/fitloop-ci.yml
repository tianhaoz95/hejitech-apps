name: FitLoop CI

# Checks pushes and PRs that touch FitLoop or what it shares with other projects (root workspace
# files, supabase/, CI plumbing). Keep `paths` in sync with CI_PATHS in projects/fitloop/release.env:
# cut_release.sh requires this workflow to be green on the newest commit that touched them. Deploys
# are separate: Cloudflare Workers Builds deploys the Worker on push to main; a fitloop-v<version>
# release runs fitloop-testflight.yml and fitloop-glasses-release.yml.
on:
  push:
    branches: [main]
    paths:
      - "projects/fitloop/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/fitloop-ci.yml"
  pull_request:
    paths:
      - "projects/fitloop/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/fitloop-ci.yml"
  workflow_dispatch:

concurrency:
  group: fitloop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Core, web + Worker, glasses (tests, typecheck, build, pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:fitloop
      - run: npm run test:fitloop
      - run: npm run build:fitloop
        env:
          WEB_ALLOW_LOCAL: "1"
      - name: Pack the plugin
        run: node projects/fitloop/apps/glasses/scripts/pack.mjs

  backend:
    name: Shared Supabase schema + Worker integration (boards, pairing, push, MCP/OAuth, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # pinned: "latest" asks the GitHub API, which rate-limits shared runners
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Applies every project's migrations and seeds: the whole shared history must replay.
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit,edge-runtime
      - name: Worker against the local stack
        working-directory: projects/fitloop/services/web
        run: |
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" > .dev.vars
          npm run dev:worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8794/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8794/ || { cat /tmp/worker.log; exit 1; }
      - run: node projects/fitloop/scripts/test-api.mjs
      - if: failure()
        run: cat /tmp/worker.log || true
      - if: always()
        run: supabase stop

  ios:
    name: iPhone app (FitLoopKit tests, simulator build)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/fitloop/apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - run: brew install xcodegen
      - name: FitLoopKit tests
        working-directory: projects/fitloop/apps/ios/FitLoopKit
        run: swift test
      - run: xcodegen generate
      - name: Build for the simulator
        run: xcodebuild -project FitLoop.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
