name: Wee Hours glasses (Even Hub plugin)

# Packs the Even G2 glasses app (.ehpk) for a published weehours-v<version> release and attaches it.
# The plugin ships with the iPhone app under the same version: scripts/cut_release.sh weehours bumps
# MARKETING_VERSION in apps/ios/project.yml, which apps/glasses/scripts/pack.mjs stamps into the
# plugin's app.json. Upload the .ehpk to the Even Hub portal by hand (projects/weehours/docs/DEPLOY.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (weehours-v<version>)"
        required: true

permissions:
  contents: write

jobs:
  pack:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'weehours-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @weehours/glasses
      - run: npm run package -w @weehours/glasses
      - name: Version matches the tag
        run: |
          v=$(node -p "require('./projects/weehours/apps/glasses/build/app.json').version")
          [ "weehours-v$v" = "$TAG" ] || { echo "app.json $v doesn't match $TAG"; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp projects/weehours/apps/glasses/build/weehours.ehpk "weehours-glasses-${TAG#weehours-v}.ehpk"
          gh release upload "$TAG" "weehours-glasses-${TAG#weehours-v}.ehpk" --clobber
