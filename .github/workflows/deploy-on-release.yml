name: Deploy on Release

on:
  workflow_run:
    workflows: ["Create Release"]
    types: [completed]
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Build Artifacts
        run: |
          pnpm turbo run build
          echo "Checking Hub artifacts..."
          ls -la apps/hub/dist/index.html
          echo "Checking Admin artifacts..."
          ls -la apps/admin/dist/index.html
          echo "Checking Landing artifacts..."
          ls -la apps/landing/dist/index.html
          echo "Checking Legal artifacts..."
          ls -la apps/legal/dist/index.html
          echo "Checking Functions artifacts..."
          ls -la firebase/functions/lib/index.js
          echo "Checking Extension artifacts..."
          ls -la apps/extension/build/chrome-mv3-prod/manifest.json

      - name: Build and Deploy
        run: ./scripts/deploy-all.sh
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
