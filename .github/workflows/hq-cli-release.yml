name: HQ CLI (npm + GitHub Packages)

# Publishes the `hq` command (@hejitech/hq, projects/hq/apps/cli) for a published hq-v<version>
# release: tests it, packs it once with the release's version, checks the tarball installs and runs
# on the oldest Node it supports, then publishes that tarball to npm as @hejitech/hq (with
# provenance) and to GitHub Packages as @<repo owner>/hq: the same files under the only scope the
# workflow's own token may write to. Re-running is safe: a version that is already there is skipped.
#
# It runs only for a published release, or by hand. By hand without a tag it packs and checks the
# branch it is started from and publishes nothing (a rehearsal); publishing always needs a tag.
#
# Secrets: NPM_TOKEN, the owner's npm token shared by every npm package this repo publishes (also
# in REQUIRED_SECRETS of projects/hq/release.env). Its account must be able to publish in the
# @hejitech scope. GitHub Packages uses the workflow's own GITHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (hq-v<version>). Empty: rehearse this branch, publish nothing"
        required: false
      dry_run:
        description: "Pack and check, but publish nothing"
        type: boolean
        default: true

concurrency:
  group: hq-cli-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PACKAGE: "@hejitech/hq"

jobs:
  pack:
    name: Test and pack
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'hq-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The package takes the release's version
        id: version
        run: |
          if [ -z "$TAG" ]; then
            VERSION="$(npm pkg get version -w "$PACKAGE" | jq -r '.[]')"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "No tag: rehearsing $PACKAGE@$VERSION from ${GITHUB_REF_NAME}; nothing will be published." >> "$GITHUB_STEP_SUMMARY"
          else
            VERSION="${TAG#hq-v}"
            [[ "$TAG" == hq-v* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not hq-v<major.minor.patch>"; exit 1; }
            npm pkg set version="$VERSION" -w "$PACKAGE"
            echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck -w "$PACKAGE" -w @hq/core
      - run: npm test -w "$PACKAGE" -w @hq/core
      - name: Pack (builds the bundle)
        run: mkdir -p "$RUNNER_TEMP/pack" && npm pack -w "$PACKAGE" --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The tarball installs and runs on Node 20, away from the repo
        run: |
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          test "$(./node_modules/.bin/hq --version)" = "${{ steps.version.outputs.version }}"
          ./node_modules/.bin/hq lint --root "$GITHUB_WORKSPACE/projects/hq/apps/cli/test/fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: hq-cli
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hq-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: The npm token works and may publish in the @hejitech scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ needs.pack.outputs.dry_run }}
        run: |
          # A rehearsal reports problems as warnings; a real publish stops on them.
          problem() { if [ "$DRY_RUN" = "true" ]; then echo "::warning::$1"; else echo "::error::$1"; exit 1; fi; }
          if [ -z "$NODE_AUTH_TOKEN" ]; then problem "The NPM_TOKEN secret is not set."; exit 0; fi
          WHO="$(npm whoami 2>/dev/null)" || { problem "npm rejects the token in NPM_TOKEN (expired or revoked?)."; exit 0; }
          echo "npm account: $WHO"
          if npm org ls hejitech "$WHO" > /dev/null 2>&1; then
            echo "$WHO is a member of the npm organization hejitech."
          else
            echo "::warning::Couldn't confirm that $WHO is in an npm organization named hejitech (it may not exist yet, or this token can't read organizations). Publishing $PACKAGE needs it: projects/hq/docs/DEPLOY.md §7."
          fi
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.pack.outputs.version }}
          DRY_RUN: ${{ needs.pack.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then npm publish ./*.tgz --access public --dry-run; exit 0; fi
          if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$PACKAGE@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm publish ./*.tgz --access public --provenance
          echo "Published https://www.npmjs.com/package/$PACKAGE/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"

  github-packages:
    name: Publish to GitHub Packages
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hq-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"
      - name: Publish as @<repo owner>/hq
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pack.outputs.version }}
          DRY_RUN: ${{ needs.pack.outputs.dry_run }}
        run: |
          # GitHub Packages only takes names in the owner's scope, so the packed files get that name.
          NAME="@$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/hq"
          tar -xzf ./*.tgz && cd package
          npm pkg set name="$NAME"
          # The bundle is already built; there is no source here for prepack to build again.
          if [ "$DRY_RUN" = "true" ]; then npm publish --ignore-scripts --dry-run; exit 0; fi
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on GitHub Packages; nothing to do."
            exit 0
          fi
          npm publish --ignore-scripts
          echo "Published $NAME@$VERSION to GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
