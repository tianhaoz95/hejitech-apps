name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get previous version
        id: get_prev_version
        run: |
          git checkout HEAD^1 package.json
          PREV_VERSION=$(node -p "require('./package.json').version")
          git checkout HEAD package.json
          echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT

      - name: Build Extension Packages
        if: steps.get_version.outputs.version != steps.get_prev_version.outputs.prev_version
        env:
          PLASMO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PLASMO_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          cp apps/extension/.env.example apps/extension/.env
          echo "PLASMO_PUBLIC_USE_EMULATOR=false" >> apps/extension/.env
          echo "PLASMO_PUBLIC_GOOGLE_CLIENT_ID=$PLASMO_PUBLIC_GOOGLE_CLIENT_ID" >> apps/extension/.env
          ./scripts/build-extension-all.sh

      - name: Create Release
        if: steps.get_version.outputs.version != steps.get_prev_version.outputs.prev_version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/extension/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
