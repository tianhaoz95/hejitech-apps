name: Headway → Google Play (internal testing)

# Publishing a GitHub Release tagged headway-v<version> (scripts/cut_release.sh headway) builds the
# Android app at that version, signs it with Headway's upload key and rolls it out to the Play
# Console's internal testing track (testers: the "HEJI owner" email list). Other projects' releases
# are skipped. Also from the Actions tab (then the version is whatever apps/ios/project.yml says).
# Deliberately not on push: it publishes a real build.
#
# Secrets: HEADWAY_ANDROID_KEYSTORE_BASE64 / _PASSWORD / HEADWAY_ANDROID_KEY_ALIAS (the upload key,
# kept in ~/Credentials/headway/) and PLAY_SERVICE_ACCOUNT_JSON (team-wide: the
# play-publisher@heji-play-publishing service account, granted "Release apps to testing tracks"
# per app in Play Console → Users and permissions). Steps: the heji-google-play skill.
on:
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: headway-play-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Build & upload Android
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'headway-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Google Play
      url: https://play.google.com/console/u/0/developers/7637681845911355660/app/4975322077562037950/tracks/internal-testing
    defaults:
      run:
        working-directory: projects/headway/apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' ../ios/project.yml | head -1)"
          echo "MARKETING_VERSION $V"
          if [ -n "$TAG" ] && [ "headway-v$V" != "$TAG" ]; then
            echo "::error::project.yml says $V but the release is $TAG (cut releases with scripts/cut_release.sh headway)"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.HEADWAY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "HEADWAY_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # versionCode: minutes since 2020-01-01 UTC, so every build (CI or a hand upload) is higher
      # than the last and it stays far below Play's 2,100,000,000 limit.
      - name: Test and build the signed bundle
        env:
          HEADWAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HEADWAY_ANDROID_KEYSTORE_PASSWORD }}
          HEADWAY_ANDROID_KEY_ALIAS: ${{ secrets.HEADWAY_ANDROID_KEY_ALIAS }}
        run: |
          VC=$(( ($(date -u +%s) - 1577836800) / 60 ))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          ./gradlew :core:test :app:bundleRelease -PversionCode="$VC" --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hejitech.headway
          releaseFiles: projects/headway/apps/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: projects/headway/apps/android/app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ env.VERSION }} (${{ env.VERSION_CODE }})
          track: internal
          status: completed

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
