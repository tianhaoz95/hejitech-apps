name: Contempo → TestFlight

# Publishing a GitHub Release tagged contempo-v<version> (scripts/cut_release.sh contempo) uploads
# that version to TestFlight; other projects' releases are skipped. Also runnable from the Actions
# tab (the version is then whatever projects/contempo/ios/project.yml says). Deliberately not on
# push: it uploads a real build.
on:
  release:
    types: [published]
  # Weekly from main: same version, new build number. Keeps TestFlight builds from expiring (90
  # days) and proves the whole delivery path (signing, model fetch, upload) still works.
  schedule:
    - cron: "45 17 * * 3" # Wednesdays 17:45 UTC (staggered after weehours-testflight.yml's 17:00)
  workflow_dispatch: {}

concurrency:
  group: contempo-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Build & upload iOS
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'contempo-v')
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: TestFlight
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' projects/contempo/ios/project.yml | head -1)"
          echo "MARKETING_VERSION $V"
          if [ -n "$TAG" ] && [ "contempo-v$V" != "$TAG" ]; then
            echo "::error::project.yml says $V but the release is $TAG (cut releases with scripts/cut_release.sh contempo)"; exit 1
          fi

      - name: Install tools
        run: brew install xcodegen

      # The bundled on-device model (~347 MB, git-ignored) ships inside the app.
      - name: Cache the bundled model
        uses: actions/cache@v4
        with:
          path: projects/contempo/ios/Contempo/Resources/Models
          key: contempo-models-${{ hashFiles('projects/contempo/scripts/fetch-models.sh') }}
      - name: Fetch the bundled model
        run: projects/contempo/scripts/fetch-models.sh

      # The team-wide HEJI identities: Apple Distribution plus the pinned Apple Development one
      # (release_testflight.sh checks its hash). Never let signing mint new ones.
      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          dev-p12-base64: ${{ secrets.DEV_SIGNING_P12_BASE64 }}
          dev-p12-password: ${{ secrets.DEV_SIGNING_P12_PASSWORD }}

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: 68CTFST8W2
        run: projects/contempo/scripts/release_testflight.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
