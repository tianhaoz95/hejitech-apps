name: G2 Digest plugin release

# Packs the Even Hub plugin (.ehpk) for a published g2digest-v<version> release and attaches it.
# scripts/cut_release.sh g2digest bumps apps/glasses/package.json and publishes the release; upload
# the .ehpk to the Even Hub portal from there (docs/DEPLOY.md §4).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (g2digest-v<version>)"
        required: true

permissions:
  contents: write

jobs:
  pack:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'g2digest-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package -w @g2digest/glasses
      - name: Version matches the tag
        run: |
          v=$(node -p "require('./projects/g2digest/apps/glasses/build/app.json').version")
          [ "g2digest-v$v" = "$TAG" ] || { echo "app.json $v doesn't match $TAG"; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp projects/g2digest/apps/glasses/build/g2digest.ehpk "g2digest-${TAG#g2digest-v}.ehpk"
          gh release upload "$TAG" "g2digest-${TAG#g2digest-v}.ehpk" --clobber
