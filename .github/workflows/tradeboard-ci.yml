name: Trading Plan Board CI

# Checks pushes and PRs that touch the Trading Plan Board or what it shares with other projects
# (root workspace files, supabase/, CI plumbing). Keep `paths` in sync with CI_PATHS in
# projects/tradeboard/release.env: cut_release.sh requires this workflow to be green on the newest
# commit that touched them. Deploys are separate: Cloudflare Workers Builds deploys the Worker on
# push to main; tradeboard-executor-release.yml attaches the executor to a tradeboard-v<version> release.
on:
  push:
    branches: [main]
    paths:
      - "projects/tradeboard/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tradeboard-ci.yml"
  pull_request:
    paths:
      - "projects/tradeboard/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tradeboard-ci.yml"
  workflow_dispatch:

concurrency:
  group: tradeboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Core, executor, portal + Worker (secrets, tests, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node projects/tradeboard/scripts/scan-tokens.mjs
      - run: npm run typecheck:tradeboard
      - run: npm run test:tradeboard
      - run: npm run build:tradeboard
        env:
          WEB_ALLOW_LOCAL: "1"

  backend:
    name: Shared Supabase schema + Worker + executor end to end (PRD §12.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # pinned: "latest" asks the GitHub API, which rate-limits shared runners
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Applies every project's migrations and seeds: the whole shared history must replay.
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit,edge-runtime
      - name: Worker against the local stack
        working-directory: projects/tradeboard/services/web
        run: |
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" > .dev.vars
          npm run dev:worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8798/login/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8798/login/ || { cat /tmp/worker.log; exit 1; }
      - run: node projects/tradeboard/scripts/test-api.mjs
      - if: failure()
        run: cat /tmp/worker.log || true
      - if: always()
        run: supabase stop
