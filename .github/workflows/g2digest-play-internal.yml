name: G2 Digest → Google Play (internal testing)

# Publishing a GitHub Release tagged g2digest-v<version> (scripts/cut_release.sh g2digest) builds
# the Android app at that version, signs it with G2 Digest's upload key and rolls it out to Google
# Play's internal testing track once G2DIGEST_PLAY_ENABLED=true is set in repo variables.
#
# Secrets: G2DIGEST_ANDROID_KEYSTORE_BASE64 / _PASSWORD / G2DIGEST_ANDROID_KEY_ALIAS (the upload key,
# kept in ~/Credentials/g2digest/) and PLAY_SERVICE_ACCOUNT_JSON (team-wide play-publisher service
# account). Steps: the heji-google-play skill.
on:
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: g2digest-play-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Build & upload Android
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'g2digest-v') && vars.G2DIGEST_PLAY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/g2digest/apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(node -p "require('../../apps/glasses/package.json').version")"
          echo "VERSION $V"
          if [ -n "$TAG" ] && [ "g2digest-v$V" != "$TAG" ]; then
            echo "::error::apps/glasses/package.json says $V but the release is $TAG (cut releases with scripts/cut_release.sh g2digest)"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.G2DIGEST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "G2DIGEST_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed bundle
        env:
          G2DIGEST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.G2DIGEST_ANDROID_KEYSTORE_PASSWORD }}
          G2DIGEST_ANDROID_KEY_ALIAS: ${{ secrets.G2DIGEST_ANDROID_KEY_ALIAS }}
        run: |
          VC=$(( ($(date -u +%s) - 1577836800) / 60 ))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          ./gradlew :core:test :app:bundleRelease -PversionCode="$VC" -PversionName="$VERSION" --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hejitech.g2digest
          releaseFiles: projects/g2digest/apps/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: projects/g2digest/apps/android/app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ env.VERSION }} (${{ env.VERSION_CODE }})
          track: internal
          status: completed

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
