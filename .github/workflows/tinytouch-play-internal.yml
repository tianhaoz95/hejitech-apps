name: TinyTouch → Google Play (internal testing)

# Publishing a GitHub Release tagged tinytouch-v<version> (scripts/cut_release.sh tinytouch) builds the
# Android phone app and the Wear OS app at that version, signs both with TinyTouch's upload key and
# rolls them out to internal testing: the phone bundle to `internal`, the watch bundle to
# `wear:internal` (the Wear OS form factor's own track; same package, one Play listing). Testers:
# the "HEJI owner" email list. Other projects' releases are skipped. Also from the Actions tab
# (then the version is whatever the Xcode project says).
# Deliberately not on push: it publishes a real build.
#
# Secrets: TINYTOUCH_ANDROID_KEYSTORE_BASE64 / _PASSWORD / TINYTOUCH_ANDROID_KEY_ALIAS (the upload key,
# kept in ~/Credentials/tinytouch/) and PLAY_SERVICE_ACCOUNT_JSON (team-wide: the
# play-publisher@heji-play-publishing service account, granted "Release apps to testing tracks"
# per app in Play Console → Users and permissions). Steps: the heji-google-play skill.
on:
  release:
    types: [published]
  workflow_dispatch: {}

concurrency:
  group: tinytouch-play-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Build & upload Android
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'tinytouch-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Google Play
      url: https://play.google.com/console/u/0/developers/7637681845911355660/app/4975430100626607403/tracks/internal-testing
    defaults:
      run:
        working-directory: projects/tinytouch/apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = "?([0-9.]+)"?;.*/\1/p' ../../ToddlerPlay.xcodeproj/project.pbxproj | sort -u)"
          echo "MARKETING_VERSION $V"
          if [ -n "$TAG" ] && [ "tinytouch-v$V" != "$TAG" ]; then
            echo "::error::ToddlerPlay.xcodeproj says $V but the release is $TAG (cut releases with scripts/cut_release.sh tinytouch)"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TINYTOUCH_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TINYTOUCH_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # versionCode: minutes since 2020-01-01 UTC, so every build (CI or a hand upload) is higher
      # than the last and it stays far below Play's 2,100,000,000 limit. The watch bundle gets the
      # same number plus one (wear/build.gradle.kts): one listing, so codes must differ.
      - name: Test and build the signed bundle
        env:
          TINYTOUCH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TINYTOUCH_ANDROID_KEYSTORE_PASSWORD }}
          TINYTOUCH_ANDROID_KEY_ALIAS: ${{ secrets.TINYTOUCH_ANDROID_KEY_ALIAS }}
        run: |
          VC=$(( ($(date -u +%s) - 1577836800) / 60 ))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          ./gradlew :core:test :app:bundleRelease :wear:bundleRelease -PversionCode="$VC" --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          jarsigner -verify wear/build/outputs/bundle/release/wear-release.aab | tail -1

      - name: Upload the phone app to the internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hejitech.tinytouch
          releaseFiles: projects/tinytouch/apps/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: projects/tinytouch/apps/android/app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ env.VERSION }} (${{ env.VERSION_CODE }})
          track: internal
          status: completed

      - name: Upload the watch app to the Wear OS internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hejitech.tinytouch
          releaseFiles: projects/tinytouch/apps/android/wear/build/outputs/bundle/release/wear-release.aab
          mappingFile: projects/tinytouch/apps/android/wear/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ env.VERSION }} watch (${{ env.VERSION_CODE }})
          track: wear:internal
          status: completed

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
