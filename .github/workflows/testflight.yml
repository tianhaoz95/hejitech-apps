name: Release to TestFlight

# Runs on a published GitHub Release, weekly on Wednesday from main (keeps TestFlight fresh; builds
# expire after 90 days), or on demand from the Actions tab. Deliberately not wired to push/tag
# events: this uploads a real build to App Store Connect.
on:
  release:
    types: [published]
  schedule:
    - cron: "0 17 * * 3" # Wednesdays 17:00 UTC (10:00 Pacific in summer, 09:00 in winter)
  workflow_dispatch: {}

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    name: Build & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen cmake

      # Same cache key as ci.yml, so a release usually reuses the framework CI already built.
      - name: Cache llama.xcframework
        id: llama
        uses: actions/cache@v4
        with:
          path: ios/Vendor/llama.xcframework
          key: llama-xcframework-${{ hashFiles('scripts/build-llama-xcframework.sh') }}
      - name: Build llama.xcframework
        if: steps.llama.outputs.cache-hit != 'true'
        run: scripts/build-llama-xcframework.sh

      # The on-device models are bundled into the app (~570 MB, git-ignored).
      - name: Cache on-device models
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Models/Laya-Q8_0.gguf
            ios/App/Models/whisper
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
      - name: Fetch on-device models
        run: scripts/fetch-models.sh

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Imports the two existing HEJI identities exported from the release Mac: Apple Development
      # (signs the archive; SPM targets are always development-signed) and Apple Distribution (the
      # export re-signs with it). With both private keys present, -allowProvisioningUpdates only
      # fetches provisioning profiles. Without them, every run would mint a new certificate that
      # is orphaned when the runner goes away, until the team hits Apple's certificate cap.
      - name: Import signing certificates
        env:
          DEV_P12_BASE64: ${{ secrets.SIGNING_DEV_P12_BASE64 }}
          DEV_P12_PASSWORD: ${{ secrets.SIGNING_DEV_P12_PASSWORD }}
          DIST_P12_BASE64: ${{ secrets.SIGNING_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.SIGNING_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          import_p12() {
            local cert_path="$RUNNER_TEMP/$1.p12"
            echo "$2" | base64 --decode > "$cert_path"
            security import "$cert_path" -k "$KEYCHAIN_PATH" -P "$3" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$cert_path"
          }
          import_p12 dev "$DEV_P12_BASE64" "$DEV_P12_PASSWORD"
          import_p12 dist "$DIST_P12_BASE64" "$DIST_P12_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')"
          # shellcheck disable=SC2086 # intentional word-splitting: each keychain path is its own arg
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # The release script refuses to run unless exactly one Apple Development and one Apple
      # Distribution identity (the imported ones) are in the keychain.
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release_testflight.sh

      - name: Clean up secrets
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
