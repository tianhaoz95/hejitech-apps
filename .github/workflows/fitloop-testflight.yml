name: FitLoop → TestFlight

# Publishing a GitHub Release tagged fitloop-v<version> (scripts/cut_release.sh fitloop) uploads
# that version of the iPhone app to TestFlight; other projects' releases are skipped. Also from the
# Actions tab (then the version is whatever projects/fitloop/apps/ios/project.yml says).
# Deliberately not on push: it uploads a real build.
on:
  release:
    types: [published]
  # Weekly from main: same version, new build number. Keeps TestFlight builds from expiring (90
  # days) and proves the whole delivery path (signing, upload) still works.
  schedule:
    - cron: "15 19 * * 3" # Wednesdays 19:15 UTC (staggered after headway-testflight.yml's 19:00)
  workflow_dispatch: {}

concurrency:
  group: fitloop-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Build & upload iOS
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'fitloop-v')
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: TestFlight
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # feedbackkit release checks that each fix commit is an ancestor of HEAD

      # App Store Connect requires the iOS 26 SDK (Xcode 26+).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' projects/fitloop/apps/ios/project.yml | head -1)"
          echo "MARKETING_VERSION $V"
          if [ -n "$TAG" ] && [ "fitloop-v$V" != "$TAG" ]; then
            echo "::error::project.yml says $V but the release is $TAG (cut releases with scripts/cut_release.sh fitloop)"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # The team-wide HEJI identities every app ships with: Apple Distribution (export) plus the
      # pinned Apple Development one (the archive signs as development). Never let
      # -allowProvisioningUpdates mint new certificates on an empty runner keychain.
      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          dev-p12-base64: ${{ secrets.DEV_SIGNING_P12_BASE64 }}
          dev-p12-password: ${{ secrets.DEV_SIGNING_P12_PASSWORD }}

      # Build numbers are UTC timestamps. The script waits for App Store Connect's processing verdict.
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: 68CTFST8W2
          FEEDBACKKIT_RELEASE_TOKEN: ${{ secrets.FITLOOP_FEEDBACKKIT_RELEASE_TOKEN }}
        run: ASC_KEY_PATH="$FA_KEY_LOCATION" projects/fitloop/scripts/release_testflight.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
