name: FeedbackKit · Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "projects/feedbackkit/supabase/functions/**"
      - "projects/feedbackkit/supabase/config.toml"
      - ".github/workflows/feedbackkit-deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: feedbackkit-supabase-functions
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/feedbackkit

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # pinned: "latest" asks the GitHub API, which rate-limits shared runners
          version: 2.121.0

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FEEDBACKKIT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.FEEDBACKKIT_SUPABASE_PROJECT_ID }}
