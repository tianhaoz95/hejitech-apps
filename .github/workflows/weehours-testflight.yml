name: Wee Hours → TestFlight

# Publishing a GitHub Release tagged weehours-v<version> (scripts/cut_release.sh weehours) uploads
# that version to TestFlight; other projects' releases are skipped. Also runs weekly on Wednesday
# from main (TestFlight builds expire after 90 days) and from the Actions tab; then the version is
# whatever projects/weehours/apps/ios/project.yml says. Deliberately not on push: it uploads a
# real build.
on:
  release:
    types: [published]
  schedule:
    - cron: "0 17 * * 3" # Wednesdays 17:00 UTC (10:00 Pacific in summer, 09:00 in winter)
  workflow_dispatch: {}

concurrency:
  group: weehours-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Build & upload iOS
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'weehours-v')
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: TestFlight
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # feedbackkit release checks that each fix commit is an ancestor of HEAD

      - name: Select the newest Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' projects/weehours/apps/ios/project.yml | head -1)"
          echo "MARKETING_VERSION $V"
          if [ -n "$TAG" ] && [ "weehours-v$V" != "$TAG" ]; then
            echo "::error::project.yml says $V but the release is $TAG (cut releases with scripts/cut_release.sh weehours)"; exit 1
          fi

      - name: Install tools
        run: brew install xcodegen cmake

      # Same cache key as weehours-ci.yml, so a release usually reuses the framework CI already built.
      - name: Cache llama.xcframework
        id: llama
        uses: actions/cache@v4
        with:
          path: projects/weehours/apps/ios/Vendor/llama.xcframework
          key: weehours-llama-xcframework-${{ hashFiles('projects/weehours/scripts/build-llama-xcframework.sh') }}
      - name: Build llama.xcframework
        if: steps.llama.outputs.cache-hit != 'true'
        run: projects/weehours/scripts/build-llama-xcframework.sh

      # The on-device models are bundled into the app (~570 MB, git-ignored).
      - name: Cache on-device models
        uses: actions/cache@v4
        with:
          path: |
            projects/weehours/apps/ios/App/Models/Laya-Q8_0.gguf
            projects/weehours/apps/ios/App/Models/whisper
          key: weehours-models-${{ hashFiles('projects/weehours/scripts/fetch-models.sh', 'projects/weehours/eval/laya.env') }}
      - name: Fetch on-device models
        run: projects/weehours/scripts/fetch-models.sh

      # The same team-wide HEJI identities Waypack ships with: Apple Distribution plus the pinned
      # Apple Development one (release_testflight.sh checks its hash). Never let signing mint new ones.
      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          dev-p12-base64: ${{ secrets.DEV_SIGNING_P12_BASE64 }}
          dev-p12-password: ${{ secrets.DEV_SIGNING_P12_PASSWORD }}

      # The release script refuses to run unless exactly one Apple Development and one Apple
      # Distribution identity (the imported ones) are in the keychain. Build numbers are UTC
      # timestamps (the builds uploaded before the monorepo already use them).
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: 68CTFST8W2
          FEEDBACKKIT_RELEASE_TOKEN: ${{ secrets.WEEHOURS_FEEDBACKKIT_RELEASE_TOKEN }}
        run: projects/weehours/scripts/release_testflight.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
