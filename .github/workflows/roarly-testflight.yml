name: Roarly → TestFlight

# Publishing a GitHub Release tagged roarly-v<version> (scripts/cut_release.sh roarly) uploads
# that version of the iOS app to TestFlight; other projects' releases are skipped.
on:
  release:
    types: [published]
  schedule:
    - cron: "30 20 * * 3" # Wednesdays 20:30 UTC (staggered after the 20:15 one)
  workflow_dispatch: {}

concurrency:
  group: roarly-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Build & upload iOS
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'roarly-v')
    runs-on: xcode-27
    timeout-minutes: 60
    environment:
      name: TestFlight
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' projects/roarly/apps/ios/project.yml | head -1)"
          echo "MARKETING_VERSION $V"
          if [ -n "$TAG" ] && [ "roarly-v$V" != "$TAG" ]; then
            echo "::error::project.yml says $V but the release is $TAG (cut releases with scripts/cut_release.sh roarly)"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # The bundled Qwen3-0.6B-4bit (~335 MB) is git-ignored; release_testflight.sh refuses to
      # archive without it.
      - name: Cache bundled on-device model
        uses: actions/cache@v4
        with:
          path: projects/roarly/apps/ios/App/Resources/Models/Qwen3-0.6B-4bit
          key: roarly-qwen3-0.6b-4bit-mlx-community-v1

      - name: Fetch bundled on-device model
        run: projects/roarly/scripts/fetch_model.sh

      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          dev-p12-base64: ${{ secrets.DEV_SIGNING_P12_BASE64 }}
          dev-p12-password: ${{ secrets.DEV_SIGNING_P12_PASSWORD }}

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: 68CTFST8W2
        run: ASC_KEY_PATH="$FA_KEY_LOCATION" projects/roarly/scripts/release_testflight.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
