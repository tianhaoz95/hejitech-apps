name: G2 Digest → TestFlight

# Publishing a GitHub Release tagged g2digest-v<version> (scripts/cut_release.sh g2digest) uploads
# that version of the iPhone app (the plugin's version) to TestFlight; other projects' releases are skipped.
on:
  release:
    types: [published]
  schedule:
    - cron: "15 20 * * 3" # Wednesdays 20:15 UTC (staggered after hq-testflight.yml's 20:00)
  workflow_dispatch: {}

concurrency:
  group: g2digest-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: Build & upload iOS
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'g2digest-v')
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: TestFlight
      url: https://testflight.apple.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$(node -p "require('./projects/g2digest/apps/glasses/package.json').version")"
          echo "version $V"
          if [ -n "$TAG" ] && [ "g2digest-v$V" != "$TAG" ]; then
            echo "::error::apps/glasses/package.json says $V but the release is $TAG (cut releases with scripts/cut_release.sh g2digest)"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          dev-p12-base64: ${{ secrets.DEV_SIGNING_P12_BASE64 }}
          dev-p12-password: ${{ secrets.DEV_SIGNING_P12_PASSWORD }}

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: 68CTFST8W2
        run: ASC_KEY_PATH="$FA_KEY_LOCATION" projects/g2digest/scripts/release_testflight.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
