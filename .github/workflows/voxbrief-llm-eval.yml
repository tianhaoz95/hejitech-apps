name: Voxbrief LLM eval

# Scores Voxbrief's Stage 2 prompts on the on-device Lite model: the macOS job exports the prompts
# the app itself builds (LLMPromptExportTests) and runs the fine-tuning pipeline's tests (ml/,
# incl. its prompt port against that export); four Linux jobs run the cases through mlx-lm on CPU;
# the last job merges them and posts pass rates to the run summary, next to
# evals/llm/baseline.json. Report only, not a gate.
#
# The eval is slow and costly, so it runs only when the prompts or the model in use change, on
# the 15th of every month (drift in dependencies), and from the Actions tab (pick samples/model,
# e.g. after editing evals/llm/cases.json). See projects/voxbrief/evals/llm/README.md.
on:
  push:
    branches: [main]
    paths:
      # Prompts: what builds them, what feeds them, and the export.
      - "projects/voxbrief/VoxbriefApp/Services/LLMCopywriterService.swift"
      - "projects/voxbrief/VoxbriefApp/Services/DictionaryCorrector.swift"
      - "projects/voxbrief/VoxbriefApp/Services/VoiceCommandProcessor.swift"
      - "projects/voxbrief/VoxbriefApp/Models/DictionaryEntry.swift"
      - "projects/voxbrief/Shared/Models/NoteTemplate.swift"
      - "projects/voxbrief/Tests/MacUnitTests/LLMPromptExportTests.swift"
      # Model: how the app runs it, and which one the eval scores.
      - "projects/voxbrief/VoxbriefApp/Services/OnDeviceLLMService.swift"
      - "projects/voxbrief/evals/llm/model.env"
  pull_request:
    paths:
      - "projects/voxbrief/VoxbriefApp/Services/LLMCopywriterService.swift"
      - "projects/voxbrief/VoxbriefApp/Services/DictionaryCorrector.swift"
      - "projects/voxbrief/VoxbriefApp/Services/VoiceCommandProcessor.swift"
      - "projects/voxbrief/VoxbriefApp/Models/DictionaryEntry.swift"
      - "projects/voxbrief/Shared/Models/NoteTemplate.swift"
      - "projects/voxbrief/Tests/MacUnitTests/LLMPromptExportTests.swift"
      - "projects/voxbrief/VoxbriefApp/Services/OnDeviceLLMService.swift"
      - "projects/voxbrief/evals/llm/model.env"
  schedule:
    - cron: "0 7 15 * *"
  workflow_dispatch:
    inputs:
      samples:
        description: Runs per case (fixed seeds 0..n-1)
        default: "3"
      model:
        description: Hugging Face model id (empty = evals/llm/model.env; Flash is mlx-community/Qwen3-4B-4bit)
        default: ""

concurrency:
  group: voxbrief-llm-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export-prompts:
    name: Export prompts (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/voxbrief
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml bundles the git-ignored model as a resource, so the app doesn't build without
      # it. Same cache key as voxbrief-ci.yml.
      - name: Cache bundled on-device model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: projects/voxbrief/VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit
          key: voxbrief-qwen3-0.6b-4bit-mlx-community-v1

      - name: Download bundled on-device model (Qwen3-0.6B-4bit)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages --quiet -U "huggingface_hub"
          hf download mlx-community/Qwen3-0.6B-4bit \
            --local-dir VoxbriefApp/Resources/Models/Qwen3-0.6B-4bit

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Export prompts
        run: |
          mkdir -p evals/llm/out
          TEST_RUNNER_VOXBRIEF_PROMPT_EXPORT="$PWD/evals/llm/out/prompts.json" \
          xcodebuild test \
            -project Voxbrief.xcodeproj \
            -scheme VoxbriefMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:VoxbriefMacTests/LLMPromptExportTests \
            | tail -n 30
          test -s evals/llm/out/prompts.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fine-tuning pipeline builds its training prompts from this export; its tests check
      # the Python port still matches every prompt the app built.
      - name: Fine-tuning pipeline tests (ml/)
        working-directory: projects/voxbrief/ml
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest
          .venv/bin/python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: voxbrief-llm-prompts
          path: projects/voxbrief/evals/llm/out/prompts.json

  eval:
    name: Eval shard ${{ matrix.shard }}/4 (mlx-lm, CPU)
    needs: export-prompts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: projects/voxbrief/evals/llm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/voxbrief/evals/llm/requirements.txt

      - name: Install mlx-lm (CPU)
        run: pip install -r requirements.txt

      - name: Pick model
        run: |
          model="${{ inputs.model }}"
          if [ -z "$model" ]; then model="$(sed -n 's/^LITE_MODEL=//p' model.env)"; fi
          echo "MODEL=$model" >> "$GITHUB_ENV"

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voxbrief-llm-eval-hf-${{ env.MODEL }}

      - uses: actions/download-artifact@v4
        with:
          name: voxbrief-llm-prompts
          path: projects/voxbrief/evals/llm/out

      - name: Run eval
        run: |
          python run_eval.py \
            --prompts out/prompts.json \
            --model "$MODEL" \
            --samples "${{ inputs.samples || '3' }}" \
            --shard "${{ matrix.shard }}/4" \
            --out out/results-${{ matrix.shard }}.json \
            --report out/report-${{ matrix.shard }}.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxbrief-llm-eval-shard-${{ matrix.shard }}
          path: projects/voxbrief/evals/llm/out/results-${{ matrix.shard }}.json

  report:
    name: Report
    needs: eval
    if: always() && needs.eval.result != 'skipped'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: projects/voxbrief/evals/llm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: voxbrief-llm-eval-shard-*
          merge-multiple: true
          path: projects/voxbrief/evals/llm/out

      - name: Merge shards
        run: |
          ls out/results-*.json
          python3 run_eval.py --merge out/results-*.json --out out/results.json --report out/report.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: voxbrief-llm-eval-results
          path: |
            projects/voxbrief/evals/llm/out/results.json
            projects/voxbrief/evals/llm/out/report.md
