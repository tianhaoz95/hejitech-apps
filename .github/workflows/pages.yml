name: HEJI Apps site → GitHub Pages

# https://tianhaoz95.github.io/hejitech-apps/: the site for every HEJI app. Home and monorepo guide
# in pages/; each project's docs (projects/<p>/docs, plus static sites listed in its pages.json)
# are copied in by scripts/pages_sync.mjs at build time.
on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "projects/*/docs/**"
      - "projects/*/report/**"
      # Static sites listed in a project's docs/pages.json
      - "projects/voxbrief/site/**"
      - "projects/meowtrix/website/**"
      - "projects/meowtrix/public/**"
      - "scripts/pages_sync.mjs"
      - "projects/feedbackkit/docs/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pages:build
      # FeedbackKit's docs are their own VitePress site (base /hejitech-apps/feedbackkit/).
      - name: Build FeedbackKit docs into the site
        working-directory: projects/feedbackkit/docs
        run: |
          npm ci
          npm run build
          cp -R .vitepress/dist ../../../pages/.vitepress/dist/feedbackkit
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
