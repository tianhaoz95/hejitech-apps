name: FitLoop glasses (Even Hub plugin)

# Packs the Even G2 glasses app (.ehpk) for a published fitloop-v<version> release and attaches it.
# The plugin ships with the iPhone app under the same version: scripts/cut_release.sh fitloop bumps
# MARKETING_VERSION in apps/ios/project.yml, which apps/glasses/scripts/pack.mjs stamps into the
# plugin's app.json. Upload the .ehpk to the Even Hub portal by hand (projects/fitloop/docs/DEPLOY.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (fitloop-v<version>)"
        required: true

permissions:
  contents: write

jobs:
  pack:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'fitloop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @fitloop/glasses
      - run: npm run package -w @fitloop/glasses
      - name: Version matches the tag
        run: |
          v=$(node -p "require('./projects/fitloop/apps/glasses/build/app.json').version")
          [ "fitloop-v$v" = "$TAG" ] || { echo "app.json $v doesn't match $TAG"; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp projects/fitloop/apps/glasses/build/fitloop.ehpk "fitloop-glasses-${TAG#fitloop-v}.ehpk"
          gh release upload "$TAG" "fitloop-glasses-${TAG#fitloop-v}.ehpk" --clobber
