name: Trading Plan Board → Mac app

# On a published GitHub Release tagged tradeboard-v<version> (scripts/cut_release.sh tradeboard;
# other projects' releases are skipped): builds the Tradeboard Executor Mac app with the same
# executor version inside, signs it with the team's Developer ID, notarizes it, attaches the DMG and
# the Tauri updater artifacts to the release and refreshes tradeboard-latest (latest.json, which
# installed apps poll, and Tradeboard-Executor-arm64.dmg for download links).
# workflow_dispatch re-runs a tag, or (no_upload) only builds, signs and notarizes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. tradeboard-v0.2.0"
        required: true
      no_upload:
        description: "Build, sign and notarize only; don't attach to the release"
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.no_upload == true && format('tradeboard-mac-validate-{0}', github.run_id) || 'tradeboard-mac-release' }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: projects/tradeboard

jobs:
  mac:
    name: Build, notarize & attach the Mac app
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'tradeboard-v')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/tradeboard/apps/desktop/src-tauri

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Executor tests
        working-directory: .
        run: npm run test:tradeboard

      # The team-wide HEJI Developer ID Application identity (imported, never created by CI) and
      # the App Store Connect key, which notarizes (apple-signing sets FA_KEY_LOCATION).
      - uses: ./.github/actions/apple-signing
        with:
          p12-base64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}

      - name: Build, sign, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          FA_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          FA_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Tradeboard's own updater key: installed apps verify updates against its public half.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TRADEBOARD_TAURI_SIGNING_PRIVATE_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          NO_UPLOAD: ${{ inputs.no_upload }}
        run: |
          ARGS=(--tag "$TAG")
          [ "$NO_UPLOAD" = "true" ] && ARGS+=(--no-upload)
          ./scripts/release_mac.sh "${ARGS[@]}"

      - name: Keep the build for inspection
        if: ${{ inputs.no_upload == true }}
        uses: actions/upload-artifact@v4
        with:
          name: tradeboard-mac
          path: projects/tradeboard/build/release-mac/
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
