name: Deploy Firebase rules & config

# Deploys Firestore/Storage security rules and Firestore indexes to the real
# contempo-platform project whenever those files change on main.
# Authenticates via Workload Identity Federation (see backend/README.md) —
# no service-account key is stored anywhere; GitHub's own OIDC token is
# exchanged for short-lived Google credentials at run time, scoped to a
# least-privilege service account (Firebase Rules Admin + Datastore Index
# Admin + Firebase Viewer) that can't touch Firestore data itself.
#
# Deliberately excludes `--only auth`: enabling/managing Auth providers goes
# through the Firebase Management API's app-provisioning endpoint, which
# needs materially broader project access than rules/indexes deploy does —
# confirmed by a live 403 in CI before this comment was written. Auth config
# changes are rare (a one-time Google Sign-in setup, not something iterated
# on like rules), so that gap isn't worth widening this service account's
# permissions for — keep deploying it manually per CLAUDE.md's
# `firebase deploy --only auth` instructions instead.
on:
  push:
    branches: [main]
    paths:
      - "backend/firestore.rules"
      - "backend/firestore.indexes.json"
      - "backend/storage.rules"
      - "backend/firebase.json"
      - "backend/.firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

concurrency:
  group: firebase-deploy
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: contempo-platform
          workload_identity_provider: projects/646737053318/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-ci@contempo-platform.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firestore rules, indexes, and Storage rules
        working-directory: backend
        run: |
          npx -y firebase-tools@latest deploy \
            --only "firestore:rules,firestore:indexes,storage" \
            --project contempo-platform \
            --non-interactive
