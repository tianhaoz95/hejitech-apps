name: Deploy Firebase rules & config

# Deploys Firestore/Storage security rules, Firestore indexes, and the web/
# Hosting site to the real contempo-platform project whenever those files
# change on main. Authenticates via Workload Identity Federation (see
# backend/README.md) — no service-account key is stored anywhere; GitHub's
# own OIDC token is exchanged for short-lived Google credentials at run time,
# scoped to a least-privilege service account (Firebase Rules Admin +
# Datastore Index Admin + Firebase Hosting Admin + Firebase Viewer) that
# can't touch Firestore data itself.
#
# Deliberately excludes `--only auth`: enabling/managing Auth providers goes
# through the Firebase Management API's app-provisioning endpoint, which
# needs materially broader project access than rules/indexes/hosting deploy
# does — confirmed by a live 403 in CI before this comment was written. Auth
# config changes are rare (a one-time Google Sign-in setup, not something
# iterated on like rules), so that gap isn't worth widening this service
# account's permissions for — keep deploying it manually per CLAUDE.md's
# `firebase deploy --only auth` instructions instead.
#
# The jobs below all run on every trigger of this workflow rather than being
# gated to only the paths that changed (e.g. a rules-only push still
# redeploys both Hosting sites) — same bundling philosophy already used for
# rules+indexes+storage in deploy-rules, and cheap/idempotent enough for a
# single-pilot-user MVP not to be worth a paths-filter job to avoid.
on:
  push:
    branches: [main]
    paths:
      - "backend/firestore.rules"
      - "backend/firestore.indexes.json"
      - "backend/storage.rules"
      - "backend/firebase.json"
      - "backend/.firebaserc"
      - "web/**"
      - "feedback/**"
      - "admin/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

concurrency:
  group: firebase-deploy
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: contempo-platform
          workload_identity_provider: projects/646737053318/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-ci@contempo-platform.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firestore rules, indexes, and Storage rules
        working-directory: backend
        run: |
          npx -y firebase-tools@latest deploy \
            --only "firestore:rules,firestore:indexes,storage" \
            --project contempo-platform \
            --non-interactive

  deploy-hosting:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: contempo-platform
          workload_identity_provider: projects/646737053318/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-ci@contempo-platform.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deploys ALL THREE Hosting sites together (--only hosting, not scoped
      # to a single site) — Firebase CLI runs every hosting entry's
      # predeploy hook whenever any hosting deploy runs, regardless of which
      # specific site --only narrows to (confirmed live: --only
      # hosting:contempo-feedback alone still ran the contempo site's `npm
      # run build` hook and failed because this job hadn't installed web/'s
      # dependencies). So there's no way to deploy one site without paying
      # for every hook anyway — might as well actually deploy all of them.
      # feedback/'s predeploy hook is just a copy, no install needed for it.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      # web/.env.local and admin/.env.local (real Firebase config) are
      # gitignored and so don't exist in this checkout — every prior CI-built
      # web/ bundle baked in undefined VITE_FIREBASE_* values before this env
      # block existed, which shipped a broken production site
      # (auth/invalid-api-key at runtime, confirmed live). These values
      # aren't secret — see web/src/lib/firebase.ts's comment: security is
      # enforced by Firestore/Storage rules (plus the admin custom claim for
      # admin/), not by hiding this object — so hardcoding them here (rather
      # than provisioning GitHub Secrets for non-secrets) is fine.
      # admin/'s vars are deliberately VITE_ADMIN_FIREBASE_* rather than
      # reusing web/'s VITE_FIREBASE_* names — both builds run from this same
      # shell env in this one step, so identically-named vars would collide
      # and one site would silently get the other's Firebase Web App config
      # (see admin/.env.example). Keep both sets in sync with their
      # respective .env.local / .env.example by hand; regenerate via
      # `firebase apps:sdkconfig WEB <APP_ID> --project contempo-platform`.
      - name: Deploy Hosting (contempo + contempo-feedback + contempo-admin)
        working-directory: backend
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDINP38Ufl3ZO0V1ISSNbwqdAOF6RE32YA
          VITE_FIREBASE_AUTH_DOMAIN: contempo-platform.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: contempo-platform
          VITE_FIREBASE_STORAGE_BUCKET: contempo-platform.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "646737053318"
          VITE_FIREBASE_APP_ID: "1:646737053318:web:5a0e0bc35f564945ac3307"
          VITE_FIREBASE_MEASUREMENT_ID: G-14GZZYZZTP
          VITE_ADMIN_FIREBASE_API_KEY: AIzaSyDINP38Ufl3ZO0V1ISSNbwqdAOF6RE32YA
          VITE_ADMIN_FIREBASE_AUTH_DOMAIN: contempo-platform.firebaseapp.com
          VITE_ADMIN_FIREBASE_PROJECT_ID: contempo-platform
          VITE_ADMIN_FIREBASE_STORAGE_BUCKET: contempo-platform.firebasestorage.app
          VITE_ADMIN_FIREBASE_MESSAGING_SENDER_ID: "646737053318"
          VITE_ADMIN_FIREBASE_APP_ID: "1:646737053318:web:8a24d7a388488b88ac3307"
          VITE_ADMIN_FIREBASE_MEASUREMENT_ID: G-4F6RMV7Z6Q
          VITE_ADMIN_GOOGLE_CLIENT_ID: 646737053318-dauoaoeggts0rq8hmdc6md3jqp6g8ugf.apps.googleusercontent.com
        run: |
          npx -y firebase-tools@latest deploy \
            --only hosting \
            --project contempo-platform \
            --non-interactive
