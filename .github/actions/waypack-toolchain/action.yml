name: Waypack app toolchain
description: Node workspaces + the trip SDK the Waypack app embeds (assets/sdk.zip), and Flutter.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Build packages the app embeds
      shell: bash
      run: |
        npm ci
        npm run build -w @waypack/bundle-schema -w @waypack/trip-sdk
        node projects/waypack/apps/mobile/tool/bundle_sdk.mjs
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.6
        channel: stable
        cache: true
    - name: Flutter packages
      shell: bash
      working-directory: projects/waypack/apps/mobile
      run: flutter pub get
